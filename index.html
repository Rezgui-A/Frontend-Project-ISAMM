<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Conquête des Territoires – Dé à chaque action</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="game-container">
    <div class="hud">
        <div class="turn-indicator" id="turnText">⚙️ PHASE DE PLACEMENT</div>
        <div class="stats-panel">
            <div class="stat">🗺️ TERRITOIRES: <span id="territoryCount">0</span>/64</div>
            <div class="stat">👤 UNITÉS: <span id="playerUnits">0</span></div>
            <div class="stat">🤖 IA: <span id="aiUnits">0</span></div>
        </div>
        <div><button id="restartGameBtn">🔄 Nouvelle partie</button></div>
    </div>
    <div class="board" id="gameBoard"></div>
    <div class="ui-panel">
        <div class="action-group" id="placementControls">
            <span style="color:#8ef">📌 PLACER :</span>
            <button id="placeSoldierBtn">⚔️ Soldat</button>
            <button id="placeCavalierBtn">🐎 Cavalier</button>
            <button id="placeTankBtn">💥 Tank</button>
        </div>
        <div class="action-group">
            <button id="undoBtn">↩️ Annuler</button>
            <button id="saveBtn">💾 Sauvegarder</button>
            <button id="loadBtn">📀 Charger</button>
            <button id="settingsBtn">⚙️ Options</button>
        </div>
    </div>
</div>

<div id="victoryModal" class="modal-overlay hidden">
    <div class="dice-card">
        <h1 id="victoryMsg" style="color:#c0f5ff">🏆 VICTOIRE!</h1>
        <p id="statsMsg" style="color:#eef"></p>
        <button id="closeVictory">🔥 Rejouer 🔥</button>
    </div>
</div>
<div id="settingsModal" class="modal-overlay hidden">
    <div class="dice-card">
        <h2 style="color:#b5f0ff">🎛️ CONFIGURATION</h2>
        <label style="color:#ccf">🤖 Difficulté IA : </label>
        <select id="difficultySelect" style="background:#111; color:#0ff; border-radius:40px; padding:6px;">
            <option value="normal">NORMAL</option>
            <option value="hard">HARDCORE</option>
        </select><br><br>
        <label style="color:#ccf">⏱️ Pause après action (secondes) : </label>
        <input type="number" id="pauseAfterAction" min="0.5" max="5" step="0.5" value="2.0"><br>
        <small>Temps pour observer le plateau avant le prochain dé</small><br><br>
        <button id="closeSettings">✔️ APPLIQUER</button>
    </div>
</div>

<!-- Scripts in order -->
<script src="js/constants.js"></script>
<script src="js/Unit.js"></script>
<script src="js/GameState.js"></script>
<script src="js/Combat.js"></script>
<script src="js/Board.js"></script>
<script src="js/AI.js"></script>
<script src="js/UIManager.js"></script>
<script src="js/Placement.js"></script>
<script src="js/SaveLoad.js"></script>
<script src="js/main.js"></script>
</body>
</html>
