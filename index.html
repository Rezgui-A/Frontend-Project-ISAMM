<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Conquête des Territoires – DÉ À CHAQUE ACTION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 20%, #121826, #03060c);
            font-family: 'Inter', 'Poppins', 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: repeating-linear-gradient(transparent 0px, transparent 3px, rgba(200, 220, 255, 0.04) 3px, rgba(200, 220, 255, 0.08) 6px);
            pointer-events: none;
        }

        .game-container {
            position: relative;
            z-index: 2;
            max-width: 1300px;
            width: 100%;
            background: rgba(10, 18, 28, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.4rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(100, 210, 255, 0.5);
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            background: rgba(0, 8, 18, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 8px 26px;
            border: 1px solid rgba(100, 210, 255, 0.6);
            box-shadow: 0 0 12px rgba(0, 200, 255, 0.2);
        }

        .turn-indicator {
            background: linear-gradient(135deg, #0a1128, #010617);
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #b5f4ff;
            text-shadow: 0 0 4px #0af;
            border-left: 3px solid #4effff;
            font-size: 1rem;
        }

        .stats-panel {
            display: flex;
            gap: 20px;
            font-weight: 500;
        }

        .stat {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 18px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            font-size: 0.9rem;
            color: #eef5ff;
            border: 1px solid rgba(100, 210, 255, 0.5);
        }

        button {
            background: linear-gradient(145deg, #1e2c3e, #0a101c);
            border: 1px solid #4effff;
            color: #d4f4ff;
            font-family: inherit;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: #2a4b6e;
            box-shadow: 0 0 14px #4effff;
            transform: scale(1.02);
            color: white;
            border-color: white;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            aspect-ratio: 1 / 1;
            background: #02070e;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 0 0 3px rgba(80, 210, 255, 0.7), 0 20px 35px black;
            margin-bottom: 20px;
        }

        .cell {
            position: relative;
            border: 1px solid rgba(80, 180, 255, 0.2);
            transition: 0.08s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .cell:hover {
            filter: brightness(1.15);
            border: 2px solid #7effff;
            z-index: 2;
            box-shadow: inset 0 0 12px cyan;
        }

        .cell.owner-player {
            background: radial-gradient(circle at 30% 30%, rgba(0, 140, 240, 0.55), rgba(0, 50, 110, 0.85));
        }

        .cell.owner-ai {
            background: radial-gradient(circle at 30% 30%, rgba(210, 55, 55, 0.55), rgba(80, 0, 0, 0.85));
        }

        .cell.owner-neutral {
            background: radial-gradient(circle at 30% 30%, #2a2f44, #121725);
        }

        .cell.bonus-attack::after {
            content: "⚔️";
            position: absolute;
            top: 2px;
            right: 3px;
            font-size: 12px;
            filter: drop-shadow(0 0 2px gold);
        }

        .cell.bonus-defense::after {
            content: "🛡️";
            position: absolute;
            top: 2px;
            right: 3px;
            font-size: 12px;
            filter: drop-shadow(0 0 2px #aaf);
        }

        .cell.trap::after {
            content: "⚠️";
            position: absolute;
            top: 2px;
            right: 3px;
            font-size: 12px;
            color: #ffaa88;
            text-shadow: 0 0 2px darkred;
        }

        .unit {
            width: 80%;
            height: 80%;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            font-weight: bold;
            font-size: 1.4rem;
            box-shadow: 0 0 10px currentColor;
        }

        .unit[data-type="Soldier"] {
            color: #8acbff;
            border-bottom: 3px solid #3a86ff;
        }

        .unit[data-type="Cavalier"] {
            color: #d0ffb0;
            border-bottom: 3px solid #6fbf4c;
        }

        .unit[data-type="Tank"] {
            color: #ffc29e;
            border-bottom: 3px solid #ff784e;
        }

        .unit span.hp {
            font-size: 0.7rem;
            background: #000000bb;
            padding: 2px 7px;
            border-radius: 30px;
            margin-top: 4px;
        }

        .valid-move {
            box-shadow: inset 0 0 0 3px #4effff, 0 0 0 2px #0ff;
            background: rgba(0, 255, 255, 0.25);
        }

        .attack-range {
            box-shadow: inset 0 0 0 3px #ff6666, 0 0 0 2px red;
            background: rgba(255, 50, 50, 0.25);
        }

        .floating-damage {
            position: absolute;
            font-weight: bold;
            font-size: 22px;
            font-family: monospace;
            color: #ffaa77;
            text-shadow: 0 0 4px black;
            pointer-events: none;
            animation: floatUp 0.8s forwards;
            z-index: 300;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-45px) scale(1.2);
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(24px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .dice-card {
            background: linear-gradient(145deg, #111c2a, #03070f);
            border: 2px solid #4effff;
            border-radius: 64px;
            padding: 2rem 2rem;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.5);
            animation: fadePop 0.25s ease;
        }

        @keyframes fadePop {
            from {
                transform: scale(0.92);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .dice-area {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 30px 0;
        }

        .dice {
            width: 110px;
            height: 110px;
            background: #0f1822;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.5), 0 0 25px #0ff;
            color: #b5f0ff;
            text-shadow: 0 0 8px cyan;
            transition: 0.05s linear;
        }

        .rolling {
            animation: diceShake 0.08s infinite alternate;
        }

        @keyframes diceShake {
            from {
                transform: rotate(0deg) scale(1);
            }
            to {
                transform: rotate(15deg) scale(1.1);
            }
        }

        .action-group {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 60px;
            padding: 6px 18px;
            display: flex;
            gap: 12px;
            backdrop-filter: blur(6px);
            border: 1px solid #4effff;
        }
        .ui-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 18px;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 700px) {
            .unit { font-size: 1rem; }
            .dice { width: 70px; height: 70px; font-size: 2.5rem; }
            button { padding: 5px 12px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="hud">
        <div class="turn-indicator" id="turnText">⚙️ PHASE DE PLACEMENT</div>
        <div class="stats-panel">
            <div class="stat">🗺️ TERRITOIRES: <span id="territoryCount">0</span>/64</div>
            <div class="stat">👤 UNITÉS: <span id="playerUnits">0</span></div>
            <div class="stat">🤖 IA: <span id="aiUnits">0</span></div>
        </div>
        <div><button id="restartGameBtn">🔄 Nouvelle partie</button></div>
    </div>
    <div class="board" id="gameBoard"></div>
    <div class="ui-panel">
        <div class="action-group" id="placementControls">
            <span style="color:#8ef">📌 PLACER :</span>
            <button id="placeSoldierBtn">⚔️ Soldat</button>
            <button id="placeCavalierBtn">🐎 Cavalier</button>
            <button id="placeTankBtn">💥 Tank</button>
        </div>
        <div class="action-group">
            <button id="undoBtn">↩️ Annuler</button>
            <button id="saveBtn">💾 Sauvegarder</button>
            <button id="loadBtn">📀 Charger</button>
            <button id="settingsBtn">⚙️ Options</button>
        </div>
    </div>
</div>

<div id="victoryModal" class="modal-overlay hidden">
    <div class="dice-card">
        <h1 id="victoryMsg" style="color:#c0f5ff">🏆 VICTOIRE!</h1>
        <p id="statsMsg" style="color:#eef"></p>
        <button id="closeVictory">🔥 Rejouer 🔥</button>
    </div>
</div>
<div id="settingsModal" class="modal-overlay hidden">
    <div class="dice-card">
        <h2 style="color:#b5f0ff">🎛️ CONFIGURATION</h2>
        <label style="color:#ccf">🤖 Difficulté IA : </label>
        <select id="difficultySelect" style="background:#111; color:#0ff; border-radius:40px; padding:6px;">
            <option value="normal">NORMAL</option>
            <option value="hard">HARDCORE</option>
        </select><br><br>
        <label style="color:#ccf">⏱️ Pause après action (secondes) : </label>
        <input type="number" id="pauseAfterAction" min="0.5" max="5" step="0.5" value="2.0"><br>
        <small>Temps pour observer le plateau avant le prochain dé</small><br><br>
        <button id="closeSettings">✔️ APPLIQUER</button>
    </div>
</div>

<script>
    // ---------- CLASSE UNITÉ ----------
    class Unit {
        constructor(type, owner) {
            this.type = type;
            this.owner = owner;
            if (type === "Soldier") { this.hp = 4; this.strength = 3; this.defense = 2; this.moveRange = 1; this.symbol = "⚔️"; }
            else if (type === "Cavalier") { this.hp = 3; this.strength = 2; this.defense = 1; this.moveRange = 2; this.symbol = "🐎"; }
            else { this.hp = 5; this.strength = 4; this.defense = 3; this.moveRange = 1; this.symbol = "💥"; }
        }
    }

    // ---------- ÉTAT GLOBAL ----------
    let board = Array(8).fill().map(() => Array(8).fill(null));
    let terrain = Array(8).fill().map(() => Array(8).fill({ type: "normal", owner: "neutral" }));
    let gamePhase = "placement"; // placement / battle
    let playerUnits = 0, aiUnits = 0;
    let playerPlaced = 0, aiPlaced = 0;
    let selectedUnit = null;
    let validMoves = [], validAttacks = [];
    let difficulty = "normal";
    let historyStack = [];
    let actionRoundActive = false;   // empêche les clics pendant le dé / pause
    let pauseDuration = 2.0;         // secondes, paramètre

    const specialMap = {
        "1,2": "bonus-attack", "2,5": "bonus-defense", "5,3": "trap", "6,6": "trap",
        "3,3": "bonus-attack", "4,6": "bonus-defense", "7,1": "trap"
    };

    function initTerrain() {
        for (let i = 0; i < 8; i++)
            for (let j = 0; j < 8; j++) {
                let key = i + "," + j;
                terrain[i][j] = { type: specialMap[key] || "normal", owner: "neutral" };
            }
    }

    function addFloatingMsg(msg, color, x = 150, y = 150) {
        let div = document.createElement('div');
        div.className = 'floating-damage';
        div.innerText = msg;
        div.style.color = color;
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 800);
    }

    function updateUI() {
        let pTerritory = 0;
        for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) if (terrain[i][j].owner === "player") pTerritory++;
        document.getElementById('territoryCount').innerText = pTerritory;
        document.getElementById('playerUnits').innerText = playerUnits;
        document.getElementById('aiUnits').innerText = aiUnits;
        if (gamePhase === "placement") {
            let msg = (playerPlaced < 5) ? `🔷 PLACEMENT (${playerPlaced}/5) - À VOUS` : "🤖 IA termine le placement...";
            document.getElementById('turnText').innerText = msg;
        } else {
            document.getElementById('turnText').innerHTML = actionRoundActive ? "🎲 LANCER LE DÉ POUR L'ACTION 🎲" : "⚔️ CLIQUEZ SUR VOTRE UNITÉ PUIS SUR UNE CASE ⚔️";
        }
    }

    function checkWin() {
        let pTerritory = 0, aTerritory = 0;
        for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
            if (terrain[i][j].owner === "player") pTerritory++;
            if (terrain[i][j].owner === "ai") aTerritory++;
        }
        if (pTerritory >= 33 || aiUnits === 0) return "player";
        if (aTerritory >= 33 || playerUnits === 0) return "ai";
        return null;
    }

    function endGame(winner) {
        if (gamePhase !== "battle") return;
        gamePhase = "ended";
        let msg = winner === "player" ? "🏆 VICTOIRE STRATÉGIQUE ! 🏆" : "💀 DÉFAITE ... HONORABLE 💀";
        document.getElementById('victoryMsg').innerHTML = msg;
        document.getElementById('statsMsg').innerHTML = `Territoires : ${document.getElementById('territoryCount').innerText}<br>Unités IA : ${aiUnits}`;
        document.getElementById('victoryModal').classList.remove('hidden');
    }

    function killUnit(r, c, owner) {
        if (board[r][c] && board[r][c].owner === owner) {
            if (owner === "player") playerUnits--; else aiUnits--;
            board[r][c] = null;
        }
    }

    async function resolveCombat(attacker, defender, aPos, dPos) {
        let attackBonus = terrain[aPos.r][aPos.c].type === "bonus-attack" ? 1 : 0;
        let defendBonus = terrain[dPos.r][dPos.c].type === "bonus-defense" ? 1 : 0;
        let aRoll = Math.floor(Math.random() * 6) + 1;
        let dRoll = Math.floor(Math.random() * 6) + 1;
        let aTotal = aRoll + attacker.strength + attackBonus;
        let dTotal = dRoll + defender.strength + defendBonus;
        addFloatingMsg(`🎲 ${aTotal} vs ${dTotal}`, "#ffcc88", 140, 140);
        if (aTotal > dTotal) {
            defender.hp -= (aTotal - dTotal);
            if (defender.hp <= 0) {
                if (defender.owner === "player") playerUnits--; else aiUnits--;
                board[dPos.r][dPos.c] = null;
                addFloatingMsg("UNITÉ DÉTRUITE!", "#ff7777", 140, 140);
                terrain[dPos.r][dPos.c].owner = attacker.owner;
                board[aPos.r][aPos.c] = null;
                board[dPos.r][dPos.c] = attacker;
                if (attacker.owner === "player") playerUnits++; else aiUnits++;
                if (terrain[dPos.r][dPos.c].type === "trap") {
                    attacker.hp -= 1;
                    addFloatingMsg("⚠️ PIÈGE -1 PV", "orange");
                    if (attacker.hp <= 0) killUnit(dPos.r, dPos.c, attacker.owner);
                }
                return true;
            } else {
                addFloatingMsg(`${defender.hp} PV restants`, "#ffaa66");
                return false;
            }
        } else {
            addFloatingMsg("Attaque repoussée!", "white");
            return false;
        }
    }

    function getValidUnitActions(r, c, unit) {
        let moves = [], attacks = [];
        if (unit.type === "Cavalier") {
            for (let dir of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
                for (let step = 1; step <= unit.moveRange; step++) {
                    let nr = r + dir[0] * step, nc = c + dir[1] * step;
                    if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) break;
                    if (board[nr][nc]) {
                        if (board[nr][nc].owner !== unit.owner) attacks.push([nr, nc]);
                        break;
                    } else moves.push([nr, nc]);
                }
            }
        } else {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if ((dr !== 0 || dc !== 0) && Math.abs(dr) + Math.abs(dc) <= 2) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                            if (!board[nr][nc]) moves.push([nr, nc]);
                            else if (board[nr][nc].owner !== unit.owner) attacks.push([nr, nc]);
                        }
                    }
                }
            }
        }
        return { moves, attacks };
    }

    // snapshot / undo
    function snapshot() {
        return {
            board: JSON.parse(JSON.stringify(board)),
            terrain: JSON.parse(JSON.stringify(terrain)),
            playerUnits, aiUnits, playerPlaced, aiPlaced,
            gamePhase, selectedUnit, validMoves, validAttacks
        };
    }

    function restoreState(state) {
        board = state.board.map(row => row.map(cell => cell ? new Unit(cell.type, cell.owner) : null));
        terrain = state.terrain;
        playerUnits = state.playerUnits; aiUnits = state.aiUnits;
        playerPlaced = state.playerPlaced; aiPlaced = state.aiPlaced;
        gamePhase = state.gamePhase;
        selectedUnit = state.selectedUnit;
        validMoves = state.validMoves; validAttacks = state.validAttacks;
        renderBoard(); updateUI(); clearHighlights();
        if (selectedUnit && gamePhase==="battle" && !actionRoundActive) highlightActions();
        if (gamePhase === "battle" && !actionRoundActive && !checkWin()) startActionRound();
    }

    function pushHistory() { historyStack.push(snapshot()); if (historyStack.length > 20) historyStack.shift(); }
    function undoMove() {
        if (gamePhase === "battle" && !actionRoundActive && historyStack.length) {
            let last = historyStack.pop();
            restoreState(last);
            addFloatingMsg("Annulation réussie", "#8effff");
        } else addFloatingMsg("Annulation impossible", "#ffaa88");
    }

    // ---------- LANCER DE DÉ AVEC ANIMATION ----------
    function showDiceModalForAction(callback) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal-overlay';
        modalDiv.innerHTML = `
            <div class="dice-card">
                <h2 style="color:#b5f0ff">🎲 LANCER DE DÉ – ACTION SUIVANTE 🎲</h2>
                <div class="dice-area">
                    <div class="dice" id="dicePlayer">⚡</div>
                    <div class="dice" id="diceAI">🤖</div>
                </div>
                <p id="diceMessage" style="margin: 20px 0; color:#ccf;">Le vainqueur pourra jouer une action</p>
                <button id="rollDiceActionBtn" style="font-size:1.2rem; padding:10px 28px;">🔮 LANCER LES DÉS 🔮</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const playerDie = document.getElementById('dicePlayer');
        const aiDie = document.getElementById('diceAI');
        const msgP = document.getElementById('diceMessage');
        const rollBtn = document.getElementById('rollDiceActionBtn');
        let rolled = false;
        rollBtn.onclick = async () => {
            if (rolled) return;
            rolled = true;
            rollBtn.disabled = true;
            msgP.innerHTML = "🎲 LANCEMENT ... 🎲";
            for (let i = 0; i < 20; i++) {
                let fake1 = Math.floor(Math.random() * 6) + 1;
                let fake2 = Math.floor(Math.random() * 6) + 1;
                playerDie.innerText = fake1;
                aiDie.innerText = fake2;
                playerDie.classList.add('rolling');
                aiDie.classList.add('rolling');
                await new Promise(r => setTimeout(r, 60));
            }
            playerDie.classList.remove('rolling');
            aiDie.classList.remove('rolling');
            const finalPlayer = Math.floor(Math.random() * 6) + 1;
            const finalAI = Math.floor(Math.random() * 6) + 1;
            playerDie.innerText = finalPlayer;
            aiDie.innerText = finalAI;
            let winner = null;
            if (finalPlayer > finalAI) winner = "player";
            else if (finalAI > finalPlayer) winner = "ai";
            else {
                msgP.innerHTML = `⚖️ ÉGALITÉ (${finalPlayer} vs ${finalAI}) - Relancez ! ⚖️`;
                rolled = false;
                rollBtn.disabled = false;
                return;
            }
            msgP.innerHTML = winner === "player" ? `🌟 VOUS GAGNEZ ! (${finalPlayer} vs ${finalAI}) 🌟` : `🤖 L'IA GAGNE ! (${finalAI} vs ${finalPlayer}) 🤖`;
            setTimeout(() => {
                modalDiv.remove();
                callback(winner);
            }, 1500);
        };
    }

    // ----- EXÉCUTION D'UNE ACTION (déplacement ou attaque) -----
    async function executeAction(owner, action, showFeedback = true) {
        if (action.type === "move") {
            let from = action.from, to = action.to;
            let unit = board[from.r][from.c];
            if (!unit || unit.owner !== owner) return false;
            pushHistory();
            if (showFeedback) addFloatingMsg(`${owner==="player"?"Vous":"IA"} déplace ${unit.type}`, "#aaffcc");
            board[to.r][to.c] = unit;
            board[from.r][from.c] = null;
            terrain[to.r][to.c].owner = owner;
            if (terrain[to.r][to.c].type === "trap") {
                unit.hp -= 1;
                addFloatingMsg("⚠️ PIÈGE -1 PV", "#ff884d");
                if (unit.hp <= 0) killUnit(to.r, to.c, owner);
            }
            renderBoard(); clearSelected();
            return true;
        } else if (action.type === "attack") {
            let from = action.from, to = action.to;
            let attacker = board[from.r][from.c];
            let defender = board[to.r][to.c];
            if (!attacker || attacker.owner !== owner || !defender) return false;
            pushHistory();
            if (showFeedback) addFloatingMsg(`${owner==="player"?"Vous":"IA"} attaque ${defender.type}`, "#ffaa88");
            await resolveCombat(attacker, defender, {r:from.r,c:from.c}, {r:to.r,c:to.c});
            renderBoard(); clearSelected();
            return true;
        }
        return false;
    }

    // ----- LANCER LE CYCLE D'ACTION : DÉ + JEU, AVEC PAUSE VISUELLE -----
    async function startActionRound() {
        if (gamePhase !== "battle") return;
        if (actionRoundActive) return;
        let winner = await new Promise(resolve => {
            showDiceModalForAction(resolve);
        });
        if (gamePhase !== "battle") return;
        if (winner === "player") {
            addFloatingMsg("🎲 Vous remportez le dé ! Choisissez une action", "#aaffff");
            actionRoundActive = false;   // le joueur peut interagir
            updateUI();
            // le joueur va cliquer sur une unité puis une case valide
        } else {
            addFloatingMsg("🎲 L'IA remporte le dé ! L'IA va agir...", "#ffaa88");
            actionRoundActive = true;    // empêche les clics pendant l'action IA
            updateUI();
            await aiPerformBestAction();
            // Pause pour voir le résultat
            let pauseMs = pauseDuration * 1000;
            await new Promise(r => setTimeout(r, pauseMs));
            let win = checkWin();
            if (win) { endGame(win); return; }
            actionRoundActive = false;
            updateUI();
            startActionRound();  // prochain dé
        }
    }

    // L'IA choisit la meilleure action possible
    async function aiPerformBestAction() {
        let actions = [];
        for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) if (board[i][j] && board[i][j].owner === "ai") {
            let unit = board[i][j];
            let { moves, attacks } = getValidUnitActions(i, j, unit);
            for (let [mx, my] of moves) {
                let score = 8 + (terrain[mx][my].type === "bonus-attack" ? 6 : terrain[mx][my].type === "bonus-defense" ? 5 : 0) - (terrain[mx][my].type === "trap" ? 22 : 0);
                actions.push({ score, from: { r: i, c: j }, to: { r: mx, c: my }, type: "move" });
            }
            for (let [ax, ay] of attacks) {
                let target = board[ax][ay];
                let score = 32 + (target ? (target.type === "Tank" ? 42 : target.type === "Soldier" ? 24 : 18) : 0);
                actions.push({ score, from: { r: i, c: j }, to: { r: ax, c: ay }, type: "attack" });
            }
        }
        if (actions.length === 0) {
            addFloatingMsg("IA : aucune action possible, passe son tour", "#ffaa66");
            await new Promise(r => setTimeout(r, 1000));
            return;
        }
        if (difficulty === "hard") actions.sort((a,b)=>b.score - a.score);
        else actions.sort((a,b)=>(b.score - a.score) + Math.random() * 6);
        let best = actions[0];
        let unitName = board[best.from.r][best.from.c].type;
        let targetCell = best.type === "move" ? `déplacement en (${best.to.r},${best.to.c})` : `attaque sur (${best.to.r},${best.to.c})`;
        addFloatingMsg(`IA ${unitName} → ${targetCell}`, "#ffffaa", 200, 200);
        await executeAction("ai", best, true);
    }

    // ----- INTERACTION JOUEUR (quand il a gagné le dé) -----
    async function playerAttemptAction(from, to) {
        if (gamePhase !== "battle") return false;
        if (actionRoundActive) { addFloatingMsg("Attendez la fin du dé...","orange"); return false; }
        let unit = board[from.r][from.c];
        if (!unit || unit.owner !== "player") return false;
        let { moves, attacks } = getValidUnitActions(from.r, from.c, unit);
        let isAttack = attacks.some(([x,y])=> x===to.r && y===to.c);
        let isMove = moves.some(([x,y])=> x===to.r && y===to.c);
        if (!isAttack && !isMove) return false;
        // Ici, le joueur a déjà gagné le dé précédent, donc on exécute directement l'action
        actionRoundActive = true;   // bloque les clics pendant l'exécution + pause
        updateUI();
        let action = { type: isAttack ? "attack" : "move", from: from, to: to };
        let success = await executeAction("player", action, true);
        let win = checkWin();
        if (win) { endGame(win); return success; }
        // Pause pour voir le résultat
        let pauseMs = pauseDuration * 1000;
        await new Promise(r => setTimeout(r, pauseMs));
        actionRoundActive = false;
        updateUI();
        startActionRound();  // prochain dé
        return success;
    }

    // ---------- PLACEMENT (alterné, robuste) ----------
    let placementTurn = "player";
    function placeUnit(row, col, type) {
        if (gamePhase !== "placement") return false;
        if (playerPlaced >= 5 && aiPlaced >= 5) return false;
        let expectedOwner = (playerPlaced === aiPlaced) ? placementTurn : (playerPlaced > aiPlaced ? "ai" : "player");
        if (expectedOwner !== "player") { addFloatingMsg("C'est à l'IA de placer", "orange"); return false; }
        let zoneValide = (expectedOwner === "player") ? (row <= 1) : (row >= 6);
        if (!zoneValide || board[row][col] !== null) return false;
        board[row][col] = new Unit(type, "player");
        terrain[row][col].owner = "player";
        playerUnits++; playerPlaced++;
        renderBoard(); updateUI();
        if (playerPlaced === 5 && aiPlaced === 5) {
            gamePhase = "battle";
            document.getElementById('placementControls').style.display = 'none';
            actionRoundActive = false;
            startActionRound();
            return true;
        }
        placementTurn = "ai";
        updateUI();
        setTimeout(() => aiPlacement(), 300);
        return true;
    }

    function aiPlacement() {
        if (gamePhase !== "placement") return;
        if (playerPlaced >= 5 && aiPlaced >= 5) return;
        let expectedOwner = (playerPlaced === aiPlaced) ? placementTurn : (playerPlaced > aiPlaced ? "ai" : "player");
        if (expectedOwner !== "ai") return;
        let available = [];
        for (let i=6;i<8;i++) for (let j=0;j<8;j++) if(!board[i][j]) available.push([i,j]);
        if (available.length) {
            let [r,c] = available[Math.floor(Math.random()*available.length)];
            let types = ["Soldier","Cavalier","Tank"];
            let chosen = types[Math.floor(Math.random()*3)];
            board[r][c] = new Unit(chosen, "ai");
            terrain[r][c].owner = "ai";
            aiUnits++; aiPlaced++;
            renderBoard(); updateUI();
            if (playerPlaced === 5 && aiPlaced === 5) {
                gamePhase = "battle";
                document.getElementById('placementControls').style.display = 'none';
                actionRoundActive = false;
                startActionRound();
                return;
            }
            placementTurn = "player";
            updateUI();
        } else {
            aiPlaced = 5;
            if (playerPlaced === 5) {
                gamePhase = "battle";
                document.getElementById('placementControls').style.display = 'none';
                startActionRound();
            }
        }
    }

    // ---------- RENDU GRAPHIQUE ----------
    function renderBoard() {
        const container = document.getElementById('gameBoard');
        container.innerHTML = '';
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                let owner = terrain[i][j].owner;
                if (owner === "player") cell.classList.add('owner-player');
                else if (owner === "ai") cell.classList.add('owner-ai');
                else cell.classList.add('owner-neutral');
                if (terrain[i][j].type === "bonus-attack") cell.classList.add('bonus-attack');
                if (terrain[i][j].type === "bonus-defense") cell.classList.add('bonus-defense');
                if (terrain[i][j].type === "trap") cell.classList.add('trap');
                let unit = board[i][j];
                if (unit) {
                    let unitDiv = document.createElement('div');
                    unitDiv.className = 'unit';
                    unitDiv.setAttribute('data-type', unit.type);
                    unitDiv.innerHTML = `${unit.symbol} ${unit.type[0]}<span class="hp">❤️${unit.hp}</span>`;
                    cell.appendChild(unitDiv);
                }
                cell.addEventListener('click', (function (r, c) { return () => onCellClick(r, c); })(i, j));
                container.appendChild(cell);
            }
        }
        if (selectedUnit && gamePhase === "battle" && !actionRoundActive) highlightActions();
    }

    function highlightActions() {
        clearHighlights();
        if (!selectedUnit) return;
        let unit = board[selectedUnit.r][selectedUnit.c];
        if (!unit) return;
        let { moves, attacks } = getValidUnitActions(selectedUnit.r, selectedUnit.c, unit);
        validMoves = moves; validAttacks = attacks;
        moves.forEach(([r, c]) => { let idx = r * 8 + c; let cell = document.getElementById('gameBoard').children[idx]; if (cell) cell.classList.add('valid-move'); });
        attacks.forEach(([r, c]) => { let idx = r * 8 + c; let cell = document.getElementById('gameBoard').children[idx]; if (cell) cell.classList.add('attack-range'); });
    }

    function clearHighlights() { let children = document.getElementById('gameBoard').children; for (let i = 0; i < children.length; i++) children[i].classList.remove('valid-move', 'attack-range'); }
    function clearSelected() { selectedUnit = null; validMoves = []; validAttacks = []; clearHighlights(); }

    function onCellClick(r, c) {
        if (gamePhase === "placement") {
            if (playerPlaced < 5) {
                let type = window.unitType || "Soldier";
                placeUnit(r, c, type);
            }
            return;
        }
        if (gamePhase === "battle" && !actionRoundActive) {
            if (selectedUnit && (validMoves.some(([x,y])=>x===r && y===c) || validAttacks.some(([x,y])=>x===r && y===c))) {
                playerAttemptAction(selectedUnit, {r,c});
                clearSelected(); renderBoard();
            } else if (board[r][c] && board[r][c].owner === "player") {
                clearSelected(); selectedUnit = {r,c}; highlightActions(); renderBoard();
            } else { clearSelected(); renderBoard(); }
        } else if (actionRoundActive) {
            addFloatingMsg("Dé ou pause en cours... patientez", "#ffaa66");
        }
    }

    // ---------- NOUVELLE PARTIE / SAVE / LOAD ----------
    function newGame() {
        board = Array(8).fill().map(()=>Array(8).fill(null));
        initTerrain();
        gamePhase = "placement";
        playerUnits = 0; aiUnits = 0; playerPlaced = 0; aiPlaced = 0;
        selectedUnit = null; validMoves = []; validAttacks = [];
        historyStack = [];
        placementTurn = "player";
        actionRoundActive = false;
        document.getElementById('placementControls').style.display = 'flex';
        renderBoard();
        updateUI();
    }
    function saveGame() { localStorage.setItem('conquete_save', JSON.stringify(snapshot())); addFloatingMsg("Partie sauvegardée","#8effaa"); }
    function loadGame() { let saved = localStorage.getItem('conquete_save'); if(saved) { let state=JSON.parse(saved); restoreState(state); addFloatingMsg("Chargement réussi","#aaffaa"); } else addFloatingMsg("Aucune sauvegarde","#ffaa88"); }

    window.onload = () => {
        newGame();
        document.getElementById('restartGameBtn').onclick = () => newGame();
        document.getElementById('undoBtn').onclick = undoMove;
        document.getElementById('saveBtn').onclick = saveGame;
        document.getElementById('loadBtn').onclick = loadGame;
        document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsModal').classList.remove('hidden');
        document.getElementById('closeSettings').onclick = () => {
            difficulty = document.getElementById('difficultySelect').value;
            let val = parseFloat(document.getElementById('pauseAfterAction').value);
            if (!isNaN(val) && val >= 0.5) pauseDuration = val;
            document.getElementById('settingsModal').classList.add('hidden');
        };
        document.getElementById('closeVictory').onclick = () => { document.getElementById('victoryModal').classList.add('hidden'); newGame(); };
        window.unitType = "Soldier";
        document.getElementById('placeSoldierBtn').onclick = () => window.unitType = "Soldier";
        document.getElementById('placeCavalierBtn').onclick = () => window.unitType = "Cavalier";
        document.getElementById('placeTankBtn').onclick = () => window.unitType = "Tank";
    };
</script>
</body>
